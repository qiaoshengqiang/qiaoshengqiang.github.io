<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Schwarzschild Black Hole — Real-time Ray Tracing</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }

  #ui {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    font: 12px/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #8fa8bd;
    background: rgba(8, 12, 20, 0.72);
    border: 1px solid rgba(90, 130, 180, 0.22);
    border-radius: 8px;
    padding: 10px 14px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    user-select: none; pointer-events: none;
    white-space: nowrap;
  }
  #ui .t  { color: #e8f1fa; font-weight: 600; letter-spacing: .04em; }
  #ui .v  { color: #6fd0ff; }
  #ui .d  { color: #4d6c85; }

  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    font: 11px ui-monospace, Menlo, monospace; color: #4a6a83;
    letter-spacing: .08em; user-select: none; pointer-events: none; z-index: 10;
  }
</style>
</head>
<body>

<div id="ui">
  <div class="t">SCHWARZSCHILD BLACK HOLE</div>
  <div class="d">────────────────────────────</div>
  <div>r<sub>s</sub> <span class="d">(视界)</span> = <span class="v">1.000</span></div>
  <div>光子球 r = <span class="v">1.500</span></div>
  <div>ISCO r = <span class="v">3.000</span></div>
  <div>相机 r = <span class="v" id="camR">--</span></div>
  <div>FPS &nbsp;&nbsp; = <span class="v" id="fps">--</span></div>
</div>

<div id="hint">拖拽旋转 &nbsp;·&nbsp; 滚轮缩放</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
/* ============================================================================
   Schwarzschild 黑洞实时光线追踪
   ----------------------------------------------------------------------------
   单位制:  G = c = 1,  rs = 2GM/c² = 1
   光子测地线方程 (Schwarzschild 度规下的 Binet 形式):
        d²u/dφ² + u = (3/2) · rs · u²        ,  u = 1/r
   积分器:  四阶 Runge–Kutta, 自适应步长
   ========================================================================== */

const VERTEX_SHADER = /* glsl */`
varying vec2 vUv;
void main() {
    vUv = uv;
    gl_Position = vec4(position.xy, 0.0, 1.0);
}
`;

const FRAGMENT_SHADER = /* glsl */`
varying vec2 vUv;

uniform vec2  uResolution;
uniform vec3  uCamPos;
uniform mat4  uCamMat;
uniform float uTanHalfFov;
uniform float uAspect;
uniform float uTime;
uniform int   uMaxSteps;
uniform float uDiskOn;

const float RS      = 1.0;    // 史瓦西半径 (单位制)
const float R_ISCO  = 3.0;    // ISCO = 6M = 3 rs
const float R_OUT   = 16.0;   // 吸积盘外缘
const int   MAX_ITER = 400;

/* ---------------- 噪声 ---------------- */

float hash31(vec3 p) {
    p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
    p *= 17.0;
    return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise3(vec3 p) {
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);

    float n000 = hash31(i + vec3(0.0, 0.0, 0.0));
    float n100 = hash31(i + vec3(1.0, 0.0, 0.0));
    float n010 = hash31(i + vec3(0.0, 1.0, 0.0));
    float n110 = hash31(i + vec3(1.0, 1.0, 0.0));
    float n001 = hash31(i + vec3(0.0, 0.0, 1.0));
    float n101 = hash31(i + vec3(1.0, 0.0, 1.0));
    float n011 = hash31(i + vec3(0.0, 1.0, 1.0));
    float n111 = hash31(i + vec3(1.0, 1.0, 1.0));

    float nx00 = mix(n000, n100, f.x);
    float nx10 = mix(n010, n110, f.x);
    float nx01 = mix(n001, n101, f.x);
    float nx11 = mix(n011, n111, f.x);
    float nxy0 = mix(nx00, nx10, f.y);
    float nxy1 = mix(nx01, nx11, f.y);
    return mix(nxy0, nxy1, f.z);
}

float fbm3(vec3 p) {
    float v = 0.0, a = 0.5;
    for (int i = 0; i < 3; i++) {
        v += a * noise3(p);
        p *= 2.03;
        a *= 0.5;
    }
    return v;
}

/* ---------------- 黑体色近似 ---------------- */

vec3 tempColor(float t) {
    t = clamp(t, 0.0, 1.0);
    vec3 c1 = vec3(1.00, 0.22, 0.04);   // 冷 — 深红
    vec3 c2 = vec3(1.00, 0.58, 0.15);   // 橙
    vec3 c3 = vec3(1.00, 0.93, 0.78);   // 黄白
    vec3 c4 = vec3(0.72, 0.86, 1.00);   // 蓝白
    if (t < 0.34) return mix(c1, c2, t / 0.34);
    if (t < 0.70) return mix(c2, c3, (t - 0.34) / 0.36);
    return mix(c3, c4, (t - 0.70) / 0.30);
}

/* ---------------- 吸积盘发射 ---------------- */

vec3 diskEmission(vec3 pos, vec3 rayDir, out float alpha) {
    alpha = 0.0;
    float r = length(pos.xz);
    if (r < R_ISCO || r > R_OUT) return vec3(0.0);

    float t = (r - R_ISCO) / (R_OUT - R_ISCO);

    /* 温度剖面  T ∝ r^(-3/4)  (Shakura–Sunyaev 薄盘) */
    float temp = pow(R_ISCO / r, 0.75);
    vec3 col = tempColor(temp);

    /* 开普勒剪切湍流:  Ω ∝ r^(-3/2) */
    float ang   = atan(pos.z, pos.x);
    float omega = 1.6 * pow(r, -1.5);
    float shear = uTime * omega * 4.0;
    float ca = cos(ang + shear), sa = sin(ang + shear);

    float n1 = fbm3(vec3(ca, sa, 0.0) * r * 0.55 + vec3(0.0, 0.0, uTime * 0.05));
    float n2 = fbm3(vec3(ca, sa, 0.0) * r * 1.60 + vec3(5.1, 3.7, uTime * 0.11));
    float dens = 0.22 + 1.55 * mix(n1, n2, 0.45);

    col *= dens;

    /* --- 相对论频移: 多普勒 + 引力红移 --- */
    float v = sqrt(0.5 / r);                    // 圆轨道速度 sqrt(M/r),  M = rs/2
    v = min(v, 0.85);
    vec3  vdir  = normalize(cross(vec3(0.0, 1.0, 0.0), pos));
    vec3  toObs = -rayDir;                      // 指向观测者
    float gamma = 1.0 / sqrt(max(1.0 - v * v, 1e-3));
    float dop   = 1.0 / max(gamma * (1.0 - v * dot(vdir, toObs)), 0.06);
    float grav  = sqrt(max(1.0 - RS / r, 1e-3));// 引力红移
    float g     = dop * grav;

    col *= pow(g, 3.0);                         // I_obs ∝ g³

    /* 透明度: 内外边缘渐隐 */
    float edge = smoothstep(0.0, 0.10, t) * (1.0 - smoothstep(0.55, 1.0, t));
    alpha = clamp(edge * 0.80 * (0.55 + 0.7 * dens), 0.0, 0.96);

    return col;
}

/* ---------------- 星空背景 ---------------- */

vec3 starField(vec3 dir) {
    vec3 col = vec3(0.0);

    /* 微弱星云 */
    float nb = noise3(dir * 3.0 + 7.0);
    col += vec3(0.035, 0.030, 0.075) * nb * nb;

    /* 两层星点 */
    for (int k = 0; k < 2; k++) {
        float scale = 90.0 * pow(2.2, float(k));
        vec3  p  = dir * scale;
        vec3  id = floor(p);
        vec3  f  = fract(p) - 0.5;
        float h  = hash31(id + vec3(float(k) * 31.7));

        if (h > 0.940) {
            float d = length(f);
            float b = (h - 0.940) / 0.060;
            float s = smoothstep(0.35, 0.0, d);
            s *= s; s *= s;
            float tw = 0.75 + 0.25 * sin(uTime * 3.0 + h * 200.0);
            vec3 sc = mix(vec3(1.0, 0.85, 0.70),
                          vec3(0.75, 0.86, 1.00),
                          fract(h * 91.7));
            col += sc * s * b * tw * 2.6;
        }
    }
    return col;
}

/* ============================================================================
   主函数
   ========================================================================== */

void main() {
    /* --- 1. 构造光线 (视空间 → 世界空间) --- */
    vec2 ndc = vUv * 2.0 - 1.0;
    vec3 dirView = normalize(vec3(ndc.x * uTanHalfFov * uAspect,
                                  ndc.y * uTanHalfFov,
                                  -1.0));
    vec3 rayDir = normalize((uCamMat * vec4(dirView, 0.0)).xyz);
    vec3 camPos = uCamPos;
    float r0 = length(camPos);

    vec3  color = vec3(0.0);
    float trans = 1.0;

    if (r0 <= RS * 1.02) {
        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
        return;
    }

    /* --- 2. 建立光线所在的二维轨道平面 --- */
    vec3  e1  = camPos / r0;
    vec3  cr  = cross(e1, rayDir);
    float crl = length(cr);

    bool  captured  = false;
    bool  escaped   = false;
    vec3  escapeDir = rayDir;

    if (crl < 1e-5) {
        /* 严格径向光线, 平面退化 */
        float d = dot(rayDir, e1);
        if (d > 0.0) { escaped = true; escapeDir = rayDir; }
        else         { captured = true; }
    } else {
        vec3 e2 = cross(cr / crl, e1);

        float Dr = dot(rayDir, e1);   // 径向分量
        float Dt = dot(rayDir, e2);   // 切向分量 (恒 > 0)

        /* 初始条件: u = 1/r,  du/dφ = -Dr / (r·Dt) */
        float u   = 1.0 / r0;
        float du  = -Dr / (r0 * Dt);
        float phi = 0.0;

        float rFar = max(80.0, r0 * 4.0);

        for (int i = 0; i < MAX_ITER; i++) {
            if (i >= uMaxSteps) { captured = true; break; }
            if (u >= 1.0)       { captured = true; break; }
            if (u <= 1.0 / rFar && du < 0.0) { escaped = true; break; }

            /* 自适应步长: 越靠近视界步长越小 */
            float dphi = 0.05 / (1.0 + 3.0 * u * u);

            float rOld   = 1.0 / u;
            float phiOld = phi;
            vec3  pOld   = rOld * (cos(phiOld) * e1 + sin(phiOld) * e2);

            /* ---- RK4:  u'' = -u + 1.5·u² ---- */
            float k1u = du;
            float k1d = -u + 1.5 * u * u;

            float uA = u  + 0.5 * dphi * k1u;
            float dA = du + 0.5 * dphi * k1d;
            float k2u = dA;
            float k2d = -uA + 1.5 * uA * uA;

            float uB = u  + 0.5 * dphi * k2u;
            float dB = du + 0.5 * dphi * k2d;
            float k3u = dB;
            float k3d = -uB + 1.5 * uB * uB;

            float uC = u  + dphi * k3u;
            float dC = du + dphi * k3d;
            float k4u = dC;
            float k4d = -uC + 1.5 * uC * uC;

            u  += dphi / 6.0 * (k1u + 2.0 * k2u + 2.0 * k3u + k4u);
            du += dphi / 6.0 * (k1d + 2.0 * k2d + 2.0 * k3d + k4d);

            float rNew   = 1.0 / u;
            float phiNew = phi + dphi;
            vec3  pNew   = rNew * (cos(phiNew) * e1 + sin(phiNew) * e2);

            /* ---- 与吸积盘求交 (薄盘位于赤道面 y = 0) ---- */
            if (uDiskOn > 0.5) {
                if (pOld.y * pNew.y < 0.0) {
                    float s = pOld.y / (pOld.y - pNew.y);
                    vec3  hit = mix(pOld, pNew, s);
                    float hr = length(hit.xz);
                    if (hr >= R_ISCO && hr <= R_OUT) {
                        vec3 rdir = normalize(pNew - pOld);
                        float a;
                        vec3 em = diskEmission(hit, rdir, a);
                        color += trans * a * em;
                        trans *= (1.0 - a);
                        if (trans < 0.01) { captured = true; break; }
                    }
                }
            }

            phi = phiNew;
            if (u > 1.0) { captured = true; break; }
        }

        if (!captured) {
            escapeDir = normalize(cos(phi) * e1 + sin(phi) * e2);
        }
    }

    /* --- 3. 背景星空 --- */
    if (!captured) {
        color += trans * starField(escapeDir);
    }

    /* --- 4. 色调映射 (ACES 近似) --- */
    color = max(color, vec3(0.0));
    vec3 x = color * 1.15;
    vec3 num = x * (2.51 * x + 0.03);
    vec3 den = x * (2.43 * x + 0.59) + 0.14;
    color = clamp(num / den, 0.0, 1.0);

    /* 轻微暗角 */
    vec2 q = vUv - 0.5;
    float vig = smoothstep(0.95, 0.25, length(q));
    color *= mix(0.72, 1.0, vig);

    gl_FragColor = vec4(color, 1.0);
}
`;

/* ============================================================================
   场景搭建
   ========================================================================== */

const container = document.body;

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.domElement.style.display = 'block';
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    52, window.innerWidth / window.innerHeight, 0.1, 2000
);
camera.position.set(0.0, 4.6, 19.5);
camera.lookAt(0, 0, 0);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed   = 0.55;
controls.zoomSpeed     = 0.85;
controls.panSpeed      = 0.0;
controls.enablePan     = false;
controls.minDistance   = 2.6;
controls.maxDistance   = 120.0;
controls.target.set(0, 0, 0);

/* --- 全屏三角形 --- */
const quadGeo = new THREE.BufferGeometry();
quadGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    -1, -1, 0,
     3, -1, 0,
    -1,  3, 0
]), 3));
quadGeo.setAttribute('uv', new THREE.BufferAttribute(new Float32Array([
    0, 0,
    2, 0,
    0, 2
]), 2));

const uniforms = {
    uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
    uCamPos:     { value: new THREE.Vector3() },
    uCamMat:     { value: new THREE.Matrix4() },
    uTanHalfFov: { value: Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) },
    uAspect:     { value: window.innerWidth / window.innerHeight },
    uTime:       { value: 0.0 },
    uMaxSteps:   { value: 300 },
    uDiskOn:     { value: 1.0 }
};

const quadMat = new THREE.ShaderMaterial({
    vertexShader: VERTEX_SHADER,
    fragmentShader: FRAGMENT_SHADER,
    uniforms: uniforms,
    depthTest: false,
    depthWrite: false
});

const quad = new THREE.Mesh(quadGeo, quadMat);
quad.frustumCulled = false;
scene.add(quad);

/* ============================================================================
   循环
   ========================================================================== */

const clock = new THREE.Clock();
let fpsAccum = 0, fpsCount = 0, fpsTimer = 0;

const elCamR = document.getElementById('camR');
const elFps  = document.getElementById('fps');

function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();

    uniforms.uResolution.value.set(w, h);
    uniforms.uAspect.value = w / h;
    uniforms.uTanHalfFov.value = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
}
window.addEventListener('resize', onResize);

function animate() {
    requestAnimationFrame(animate);

    const dt = Math.min(clock.getDelta(), 0.1);
    const t  = clock.elapsedTime;

    controls.update();
    camera.updateMatrixWorld(true);

    /* 相机世界矩阵的旋转部分 */
    const rot = new THREE.Matrix4().extractRotation(camera.matrixWorld);
    uniforms.uCamMat.value.copy(rot);
    uniforms.uCamPos.value.copy(camera.position);
    uniforms.uTime.value = t;

    /* 视界内时禁用轨道控制的下限保护 */
    const r = camera.position.length();
    if (r < 1.08) {
        camera.position.setLength(1.08);
    }

    renderer.render(scene, camera);

    /* UI 更新 */
    fpsAccum += dt; fpsCount++; fpsTimer += dt;
    if (fpsTimer > 0.4) {
        elFps.textContent = (fpsCount / fpsAccum).toFixed(0);
        fpsAccum = 0; fpsCount = 0; fpsTimer = 0;
    }
    if ((performance.now() | 0) % 8 === 0) {
        elCamR.textContent = r.toFixed(2);
    }
}

/* 启动 */
onResize();
animate();

console.log(
    '%c Schwarzschild Black Hole ',
    'background:#0a1220;color:#6fd0ff;font-weight:bold;padding:2px 6px;border-radius:3px',
    '\n物理: 零测地线 RK4 积分  |  视界 rs=1  |  光子球 1.5  |  ISCO 3.0'
);
</script>

</body>
</html>
