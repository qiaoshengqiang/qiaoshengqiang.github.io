<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>⚡ 交互式电路实验室 · Circuit Laboratory</title>

  <script type="module" crossorigin src="./assets/index-r59E41jq.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BK--y90j.css">
</head>
<body>

<div class="app" id="app">

  <!-- ============ 顶栏 ============ -->
  <header class="topbar">
    <div class="logo">
      <span class="zap">⚡</span>
      <span class="txt">交互式电路实验室</span>
      <span class="ver">V2</span>
    </div>

    <nav class="mode-tabs" id="modeTabs">
      <button class="tab"        data-mode="experiment">实验模式</button>
      <button class="tab active" data-mode="free">自由搭建</button>
    </nav>

    <div class="spacer"></div>

    <label class="model-pick">
      <span>物理模型</span>
      <select id="modelSelect"></select>
    </label>

    <button class="btn" id="btnClassroom" title="课堂模式（全屏）">🖥️ 课堂模式</button>
    <button class="btn-icon" id="btnHelp"      title="使用帮助">❓</button>
  </header>

  <!-- ============ 主体三栏 ============ -->
  <div class="body">

    <!-- 左侧：器材库 / 实验列表 -->
    <aside class="palette" id="palette" aria-label="器材库"></aside>

    <!-- 中央：实验台 -->
    <main class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint">
        <span class="big">🔌</span>
        点击左侧<b>器材库</b>添加元件<br />
        拖动<b>端子</b>（小圆点）连接导线<br />
        点击<b>开关</b>切换通断 · 拖动<b>滑片</b>调节阻值
      </div>
    </main>

    <!-- 右侧：信息面板（main.js 会在此内部拆分 propertyPanel / panelBody） -->
    <aside class="panel" id="panel" aria-label="信息面板"></aside>
  </div>

  <!-- ============ 底部工具栏 ============ -->
  <footer class="toolbar">
    <button class="btn primary" id="btnCheck">🔍 检查电路</button>
    <button class="btn run"     id="btnRun">▶ 通电</button>
    <button class="btn"         id="btnPause" disabled>⏸ 暂停</button>
    <button class="btn"         id="btnUndo">↶ 撤销</button>
    <button class="btn"         id="btnRedo">↷ 重做</button>
    <button class="btn"         id="btnClear">🗑 清空</button>
    <div class="spacer"></div>
    <div class="status" id="status">就绪 · 点击「通电」开始计算</div>
  </footer>
</div>

<!-- ============ 通用弹窗 ============ -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

</body>
</html>
