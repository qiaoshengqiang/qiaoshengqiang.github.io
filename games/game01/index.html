<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>修仙奇遇录</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#14100c;color:#d8c9a8;font-family:"KaiTi","STKaiti",serif;min-height:100vh;-webkit-text-size-adjust:100%}
body{display:flex;justify-content:center;padding:12px}
#game{width:100%;max-width:820px;background:#1e1710;border:1px solid #4a3a26;border-radius:10px;padding:16px;box-shadow:0 0 50px rgba(0,0,0,.7);display:flex;flex-direction:column;gap:10px}
h1{font-size:20px;text-align:center;color:#e8c86a;letter-spacing:6px;font-weight:normal;text-shadow:0 0 12px rgba(232,200,106,.3)}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;background:#17120c;border:1px solid #3a2e1e;border-radius:6px;padding:10px;font-size:13px}
.stat{display:flex;justify-content:space-between;gap:6px;padding:6px 10px;background:#0e0a06;border:1px solid #3a2e1e;border-radius:5px}
.stat span:first-child{color:#8a7a5c;flex-shrink:0}
.stat span:last-child{color:#e8c86a;text-align:right}
.stat.warn span:last-child{color:#e8d86a}
.stat.danger span:last-child{color:#e86a6a;animation:pulseRed 1.4s infinite}
.stat.skill-btn{cursor:pointer;transition:border-color .15s}
.stat.skill-btn:hover{border-color:#e8c86a}
.stat.skill-btn span:last-child{color:#6ad8d8}
@keyframes pulseRed{0%,100%{opacity:1}50%{opacity:.6}}
#equipBar{display:flex;gap:6px;background:#17120c;border:1px solid #3a2e1e;border-radius:6px;padding:6px 8px;font-size:12px;align-items:center}
.equip-slot-mini{flex:1;display:flex;align-items:center;gap:4px;padding:5px 6px;border:1px solid #3a2e1e;border-radius:4px;cursor:pointer;background:#1e1710;min-width:0}
.equip-slot-mini:hover{border-color:#e8c86a}
.mini-label{color:#8a7a5c;font-size:10px;flex-shrink:0}
.mini-name{color:#d8c9a8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-empty{color:#4a3a26;font-size:12px}
#text{background:#17120c;border:1px solid #3a2e1e;border-radius:6px;padding:14px;height:320px;overflow-y:auto;line-height:1.85;font-size:15px;-webkit-overflow-scrolling:touch}
#text p{margin-bottom:2px;word-wrap:break-word}
#text p:empty{height:8px}
#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
button{background:#241c12;color:#d8c9a8;border:1px solid #4a3a26;border-radius:6px;padding:11px 10px;font-size:14px;font-family:inherit;cursor:pointer;text-align:center;line-height:1.3;transition:all .15s;width:100%;word-break:break-all}
button:hover{background:#322616;border-color:#e8c86a;color:#e8c86a}
button:active{transform:scale(.98)}
button.danger{border-color:#6a2a2a;color:#d88a8a}
button.danger:hover{border-color:#e86a6a;color:#e86a6a}
button:disabled{opacity:.4;cursor:not-allowed}
button.section{grid-column:1/-1;background:#17120c;border-color:#8a7a5c;color:#8a7a5c;cursor:default;font-size:12px;padding:6px}
button.section:hover{background:#17120c;border-color:#8a7a5c;color:#8a7a5c}
button.random{border-color:#c88ae8;color:#c88ae8}
button.random:hover{border-color:#e8a8ff;color:#e8a8ff}
button.limited{border-color:#e8a86a;color:#e8a86a}
button.limited:hover{border-color:#ffc88a;color:#ffc88a}
button.shop-xiaotanfan{border-color:#a0a0a0;color:#a0a0a0}
button.shop-baicaotang{border-color:#6ad86a;color:#6ad86a}
button.shop-zhenbaoge{border-color:#6a9ad8;color:#6a9ad8}
button.shop-wanbaolou{border-color:#c88ae8;color:#c88ae8}
button.shop-tianjige{border-color:#e8c86a;color:#e8c86a}
button.shop-heishi{border-color:#e86a6a;color:#e86a6a}
#text::-webkit-scrollbar,.inv-list::-webkit-scrollbar{width:6px}
#text::-webkit-scrollbar-thumb,.inv-list::-webkit-scrollbar-thumb{background:#4a3a26;border-radius:3px}
.ending{color:#e8c86a;font-size:17px;letter-spacing:2px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;justify-content:center;align-items:center;z-index:100;padding:12px}
.panel{background:#1e1710;border:1px solid #4a3a26;border-radius:10px;padding:16px;width:100%;max-width:720px;max-height:90vh;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 60px rgba(0,0,0,.9)}
.panel h2{font-size:17px;color:#e8c86a;font-weight:normal;letter-spacing:4px;text-align:center}
.panel h3{font-size:13px;color:#8a7a5c;font-weight:normal;letter-spacing:2px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.inv-slot{background:#17120c;border:1px solid #3a2e1e;border-radius:6px;padding:8px;font-size:13px;cursor:pointer;min-height:56px;display:flex;flex-direction:column;gap:3px}
.inv-slot:hover{border-color:#e8c86a}
.inv-slot.empty{color:#4a3a26;justify-content:center;align-items:center;cursor:default}
.inv-slot.equipped{border-color:#6a8a4a}
.inv-slot.unique{border-color:#e86a6a}
.slot-name{color:#d8c9a8}
.slot-type{color:#8a7a5c;font-size:11px}
.slot-rarity-普通{color:#a0a0a0}
.slot-rarity-稀有{color:#6a9ad8}
.slot-rarity-传说{color:#e8c86a}
.slot-rarity-唯一{color:#e86a6a}
.slot-price{color:#8ac86a;font-size:11px}
.inv-list{overflow-y:auto;max-height:50vh;-webkit-overflow-scrolling:touch}
.item-detail{background:#17120c;border:1px solid #3a2e1e;border-radius:6px;padding:12px;font-size:14px;line-height:1.7}
.item-detail .name{color:#e8c86a;font-size:16px}
.item-detail .name.unique{color:#e86a6a}
.item-detail .meta{color:#8a7a5c;font-size:12px}
.item-detail .desc{color:#a89878;font-size:13px;margin-top:4px}
.item-detail .unique-tag{color:#e86a6a;font-size:12px;margin-top:4px}
.item-detail .price-line{color:#8ac86a;font-size:13px;margin-top:8px}
.panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel-actions.three{grid-template-columns:1fr 1fr 1fr}
.panel-actions button.wide{grid-column:1/-1}
.divider{border-top:1px solid #3a2e1e;margin:4px 0}
.heal-hint{background:#1e2a18;border:1px solid #4a8a3a;border-radius:6px;padding:8px 10px;font-size:13px;color:#a8d888;text-align:center}
.live-stats{background:#0e0a06;border:1px solid #4a3a26;border-radius:6px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:#a89878;margin-top:2px}
.live-stats span{display:flex;align-items:center;gap:4px}
.live-stats b{font-weight:normal}
.codex-realm{background:#17120c;border:1px solid #3a2e1e;border-left:4px solid #3a2e1e;border-radius:6px;margin-bottom:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.codex-realm.easy{border-left-color:#6ad86a}
.codex-realm.normal{border-left-color:#d8c9a8}
.codex-realm.hard{border-left-color:#e8d86a}
.codex-realm.danger{border-left-color:#e86a6a}
.codex-realm.cleared{border-left-color:#4a3a26;opacity:0.6}
.codex-realm.locked{opacity:0.45}
.codex-name{color:#e8c86a;font-size:15px;font-weight:bold;letter-spacing:1px}
.codex-meta{color:#8a7a5c;font-size:12px}
.codex-desc{color:#a89878;font-size:12px}
.codex-npc{color:#e8a888;font-size:12px}
.skill-list{display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:55vh}
.skill-card{background:#17120c;border:1px solid #3a2e1e;border-left:4px solid #3a2e1e;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.skill-card.slot-rarity-普通{border-left-color:#a0a0a0}
.skill-card.slot-rarity-稀有{border-left-color:#6a9ad8}
.skill-card.slot-rarity-传说{border-left-color:#e8c86a}
.skill-card.slot-rarity-唯一{border-left-color:#e86a6a}
.skill-name{color:#e8c86a;font-size:15px;font-weight:bold}
.skill-meta{color:#8a7a5c;font-size:12px}
.skill-effect{color:#a8d888;font-size:13px}
.skill-desc{color:#a89878;font-size:12px}
.realm-easy{color:#6ad86a}
.realm-normal{color:#d8c9a8}
.realm-hard{color:#e8d86a}
.realm-danger{color:#e86a6a}
.warn-box{background:#2a1e18;border:1px solid #8a4a2a;border-radius:6px;padding:8px 10px;font-size:13px;color:#e8a888;margin-top:6px}
.synth-pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;overflow-y:auto;max-height:50vh}
.synth-slot{background:#17120c;border:1px solid #3a2e1e;border-radius:6px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.synth-slot:hover{border-color:#e8c86a}
.synth-slot.disabled{opacity:.4;cursor:not-allowed}
.synth-slot.selected{border-color:#e8c86a;background:#241c12}
.ascend-overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,#3a2a10 0%,#14100c 70%);z-index:200;display:flex;justify-content:center;align-items:center;overflow:hidden}
.ascend-glow{position:absolute;top:50%;left:50%;width:200%;height:200%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(232,200,106,.18) 0%,transparent 60%);animation:ascendPulse 4s ease-in-out infinite;pointer-events:none}
@keyframes ascendPulse{0%,100%{opacity:.5;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}}
.ascend-content{position:relative;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:40px 24px;text-align:center;color:#d8c9a8;font-family:"KaiTi","STKaiti",serif;font-size:16px;line-height:2;z-index:1}
.ascend-content p{margin-bottom:4px;opacity:0;animation:ascendFadeIn 1s ease-out forwards}
.ascend-content p.ascend-title{color:#e8c86a;font-size:20px;letter-spacing:6px;margin-top:10px;text-shadow:0 0 12px rgba(232,200,106,.5)}
.ascend-content p.ascend-highlight{color:#ffe8a8;font-size:18px;letter-spacing:3px;text-shadow:0 0 16px rgba(255,232,168,.6)}
.ascend-content p.ascend-divider{color:#8a7a5c;letter-spacing:2px}
.ascend-content p.ascend-final{color:#e8c86a;font-size:22px;letter-spacing:12px;margin-top:16px;text-shadow:0 0 20px rgba(232,200,106,.8)}
.ascend-content button{margin-top:30px;background:#241c12;color:#e8c86a;border:1px solid #e8c86a;border-radius:6px;padding:14px 40px;font-size:16px;font-family:inherit;cursor:pointer;letter-spacing:4px;opacity:0;animation:ascendFadeIn .8s ease-out forwards;animation-delay:.3s;width:auto}
.ascend-content button:hover{background:#322616;box-shadow:0 0 20px rgba(232,200,106,.3)}
@keyframes ascendFadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){
body{padding:6px}
#game{padding:12px;gap:8px}
h1{font-size:17px}
#stats{grid-template-columns:repeat(2,1fr);font-size:12px;padding:8px;gap:6px}
#text{height:280px;padding:12px;font-size:14px}
button{padding:10px 6px;font-size:13px}
.panel{padding:14px;gap:8px}
.inv-grid{grid-template-columns:repeat(2,1fr);gap:6px}
.inv-slot{padding:6px;font-size:12px;min-height:50px}
.synth-pool{grid-template-columns:repeat(2,1fr)}
.ascend-content{font-size:14px;padding:30px 16px}
.ascend-content p.ascend-title{font-size:17px}
.ascend-content p.ascend-final{font-size:18px;letter-spacing:8px}
}
@media(max-width:360px){
button{font-size:12px;padding:9px 4px}
.inv-grid{grid-template-columns:1fr}
.synth-pool{grid-template-columns:1fr}
}
</style>
</head>

</div>

}

const DUNGEON_DIFFICULTY=1.2;
const DUNGEON_LAYER_BONUS=0.05;

function getNPC(npcId,layerIdx){
  const data=NPC_DATA[npcId];
  if(!data)return null;
  const curve=NPC_SCALE[data.type]||[1,1.6,2.6,4,6];
  let m=curve[s.realm];
  if(layerIdx!==undefined&&layerIdx!==null){m*=DUNGEON_DIFFICULTY*(1+DUNGEON_LAYER_BONUS*layerIdx);}
  return {id:npcId,name:data.name,type:data.type,rank:data.rank,
    hp:Math.floor(data.base.hp*m),atk:Math.floor(data.base.atk*m),
    drops:data.drops||[],desc:data.desc,strong:data.strong||false};
}

    /* ============ 装备池（用于合成和宝箱） ============ */
    function getEquipPool(realm, rarities){
      const list=[];
      Object.keys(ITEMS).forEach(id=>{
        const it=ITEMS[id];
        if(it.type!=="攻击法器"&&it.type!=="防御法器")return;
        if(it.unique)return;
        if(it.realm!==realm)return;
        if(rarities&&!rarities.includes(it.rarity))return;
        list.push(id);
      });
      return list;
    }

    /* ============ 状态 ============ */
    let s={};
    let trainingAborted=false;
    let trainingInProgress=false;
    let currentScene="main";
    const statsEl=document.getElementById("stats");
    const equipBarEl=document.getElementById("equipBar");
    const textEl=document.getElementById("text");
    const choicesEl=document.getElementById("choices");

    function print(msg){const p=document.createElement("p");p.textContent=msg;if(msg==="")p.innerHTML="&nbsp;";textEl.appendChild(p);textEl.scrollTop=textEl.scrollHeight;}
    function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
    async function typePrint(text,speed){if(speed===undefined)speed=18;const p=document.createElement("p");textEl.appendChild(p);for(let i=0;i<text.length;i++){p.textContent+=text[i];textEl.scrollTop=textEl.scrollHeight;if(speed>0)await sleep(speed);}return p;}
    function addChoice(text,fn,cls){const btn=document.createElement("button");btn.textContent=text;if(cls)btn.className=cls;btn.onclick=fn;choicesEl.appendChild(btn);const kids=Array.from(choicesEl.children);kids.forEach(k=>{if(!k.classList.contains("section"))k.style.gridColumn="";});const real=kids.filter(k=>!k.classList.contains("section"));if(real.length>1&&real.length%2===1)real[real.length-1].style.gridColumn="1 / -1";}
    function addSection(text){const btn=document.createElement("button");btn.textContent=text;btn.className="section";choicesEl.appendChild(btn);}
    function getCurrentYear(){return 1+s.lifeSpent;}
    function getNominalYear(){return 1+(s.nominalLifeSpent||0);}

    function getAtkBonus(){
      let b=0;const a=s.equipment.attack;
      if(a&&ITEMS[a])b+=getEquipBonus(ITEMS[a]);
      if(s.permAtkBonus)b+=s.permAtkBonus;
      return b;
    }
    function getDefReduction(){
      let r=0;const d=s.equipment.defense;
      if(d&&ITEMS[d])r+=getEquipBonus(ITEMS[d]);
      return r;
    }
    function getHpPerTurn(){
      let h=0;
      if(s.equipment.attack==="chiyandao")h-=2;
      if(s.equipment.attack==="yinluofan")h-=4;
      if(s.equipment.attack==="xuemojian")h-=3;
      if(s.equipment.attack==="yuancishenshan")h-=6;
      if(s.equipment.defense==="lingguangzhao")h+=2;
      if(s.equipment.defense==="ziluoyi")h+=3;
      if(s.learnedSkills.includes("xuemogong"))h-=1;
      return h;
    }
    function getLifeCostMod(){let m=0;if(s.equipment.defense==="qingfengpao")m+=15;if(s.equipment.defense==="shanhefan")m+=30;if(s.learnedSkills.includes("guixishu"))m+=10;if(s.equipment.special==="zaohuayudie")m+=15;return Math.min(50,m);}
    function getBreakthroughBonus(){let b=0;if(s.equipment.special==="yaodan")b+=10;if(s.equipment.special==="wuseKongque")b+=15;if(s.learnedSkills.includes("qingxinzhou"))b+=5;return b;}
    function getMeditateBonus(){let b=0;if(s.equipment.special==="julingzhu")b+=30;if(s.learnedSkills.includes("nalingjue"))b+=10;return b;}
    function getDropBonus(){let b=0;if(s.equipment.special==="xunbaoluopan")b+=15;if(s.equipment.special==="qiankundai")b+=15;return b;}
    function getPlayerAttack(){return Math.floor((5+s.realm*3)*(1+s.realm*0.15))+getAtkBonus();}
    function spendLife(years){const mod=getLifeCostMod();const actual=years*(1-mod/100);s.lifespan-=actual;s.lifeSpent+=years;s.nominalLifeSpent=(s.nominalLifeSpent||0)+years;return actual;}

    function updateStats(){
      const req=REQ[s.realm];
      const cultText=req===Infinity?"圆满":Math.floor(s.cultivation)+" / "+req;
      const year=getCurrentYear();
      const hpRatio=s.hp/s.maxHp;
      let hpClass="";if(hpRatio<0.3)hpClass="danger";else if(hpRatio<0.5)hpClass="warn";
      let lifeClass="";if(s.lifespan<20)lifeClass="danger";else if(s.lifespan<50)lifeClass="warn";
      statsEl.innerHTML=`<div class="stat"><span>境界</span><span>${REALM_INFO[s.realm]}期</span></div>
    <div class="stat"><span>修为</span><span>${cultText}</span></div>
    <div class="stat ${hpClass}"><span>气血</span><span>${Math.max(0,s.hp)} / ${s.maxHp}</span></div>
    <div class="stat"><span>灵石</span><span>${s.spirit}</span></div>
    <div class="stat ${lifeClass}"><span>寿元</span><span>${Math.floor(s.lifespan)} 年</span></div>
    <div class="stat"><span>年份</span><span>第 ${year} 年</span></div>
    <div class="stat"><span>悟性</span><span>${s.comprehension}</span></div>
    <div class="stat skill-btn" id="skillBtn"><span>功法</span><span>${s.learnedSkills.length} 门 ▸</span></div>`;
      const sb=document.getElementById("skillBtn");
      if(sb)sb.onclick=showSkills;
      updateEquipBar();
    }
    function updateEquipBar(){
      const slots=[{key:"attack",label:"攻"},{key:"defense",label:"防"},{key:"special",label:"特"}];
      equipBarEl.innerHTML="";
      slots.forEach(({key,label})=>{
        const id=s.equipment[key];const div=document.createElement("div");div.className="equip-slot-mini";
        if(id){const it=ITEMS[id];const rc=it.rarity==="唯一"?"唯一":it.rarity;div.innerHTML=`<span class="mini-label">${label}</span><span class="mini-name slot-rarity-${rc}">${it.name}</span>`;}
        else{div.innerHTML=`<span class="mini-label">${label}</span><span class="mini-empty">空</span>`;}
        div.onclick=()=>showInventory();equipBarEl.appendChild(div);
      });
    }

    function init(){
      s={realm:0,cultivation:0,hp:100,maxHp:100,spirit:30,lifespan:100,lifeSpent:0,nominalLifeSpent:0,
        comprehension:5,turn:0,failCount:0,ended:false,
        inventory:[],equipment:{attack:null,defense:null,special:null},
        learnedSkills:[],pendingItem:null,pendingCallback:null,
        bonusBreakthrough:0,permAtkBonus:0,allBonus:0,
        uniqueObtained:{},uniqueLost:{},lifespanUsed:{},
        knownRealms:{},realmProgress:{},obtainedBuffs:{},
        randomTasks:[],randomTasksRefreshYear:0,randomTasksRealm:-1,randomTasksRefreshCount:0};
      trainingAborted=false;trainingInProgress=false;currentScene="main";
      textEl.innerHTML="";choicesEl.innerHTML="";
      print("【修仙奇遇录】");print("");
      print("你自幼体弱，被路过的青云门长老看中，带入山门。");
      print("从此，你踏上了修仙之路。");print("");
      print("修仙界残酷，寿元耗尽则身死道消。突破境界可延寿。");
      print("");print("—— 愿你仙途顺遂 ——");print("");
      updateStats();showActions();
    }
    function turnEnd(){
      s.turn++;const hpDelta=getHpPerTurn();
      if(hpDelta!==0){s.hp+=hpDelta;if(hpDelta>0)print("（每回合恢复 "+hpDelta+" 气血）");else print("（每回合损失 "+Math.abs(hpDelta)+" 气血）");}
      updateStats();if(checkEnd())return;showActions();
    }
    function checkEnd(){
      if(s.ended)return true;
      if(s.lifespan<=0){endGameByScene("寿元耗尽");return true;}
      if(s.hp<=0){endGameByScene("身死道消");return true;}
      if(s.failCount>=3){endGame("走火入魔","连续突破失败，真气逆冲，你经脉寸断，神智尽失，沦为山野间的一具行尸。");return true;}
      return false;
    }
    function endGameByScene(type){
      if(type==="寿元耗尽"){
        let desc="";
        if(currentScene==="training")desc="你正在历练途中，忽觉寿元将尽，脚步渐沉，气息渐弱。你倒在路边，再未起身。";
        else if(currentScene==="dungeon")desc="你身处秘境深处，气血衰败，寿元枯竭，再也无力前行。你倒在了无人知晓的角落。";
        else if(currentScene==="breakthrough")desc="你强冲瓶颈，寿元却已枯竭。真气散尽，你盘坐而逝，未能跨过那道门槛。";
        else desc="你盘坐于洞府之中，鬓发皆白，气息渐弱。最终化作一抔黄土，与山川同寂。";
        endGame("寿元耗尽",desc);
      }else{
        let desc="";
        if(currentScene==="training")desc="你在历练途中遭遇强敌，力战不敌，倒在了血泊之中。";
        else if(currentScene==="dungeon")desc="你在秘境深处被守卫击倒，倒在了阴暗的石室之中。";
        else if(currentScene==="breakthrough")desc="突破失败，真气反噬，你经脉寸断，当场殒命。";
        else desc="你倒在血泊之中，眼前走马灯般闪过此生种种。修仙路断，魂魄归墟。";
        endGame("身死道消",desc);
      }
    }
    function endGame(title,desc){
      s.ended=true;print("");
      const p=document.createElement("p");p.className="ending";p.textContent="【结局 · "+title+"】";textEl.appendChild(p);
      print(desc);print("");print("共经历 "+s.turn+" 回合，终年 "+(16+s.lifeSpent)+" 岁。");print("");
      choicesEl.innerHTML="";addChoice("重新开始",init);textEl.scrollTop=textEl.scrollHeight;
    }

    function showActions(){
      choicesEl.innerHTML="";if(s.ended)return;currentScene="main";
      const costs=LIFE_COST[s.realm];
      addChoice("打坐修炼（-"+costs[0]+" 年）",meditate);
      addChoice("外出历练",trainingMenu);
      const timeRealms=getAvailableTimeRealms();
      const tokenRealms=getAvailableTokenRealms();
      if(timeRealms.length>0||tokenRealms.length>0){
        let label="探索秘境（";
        if(timeRealms.length>0)label+="洞天 "+timeRealms.length;
        if(timeRealms.length>0&&tokenRealms.length>0)label+=" · ";
        if(tokenRealms.length>0)label+="道具 "+tokenRealms.length;
        label+="）";
        addChoice(label,exploreMenu);
      }else{
        addChoice("探索秘境（暂无可进）",()=>{print("目前没有可进入的秘境。");print("");showActions();});
      }
      addChoice("储物袋 / 装备",()=>showInventory());
      addChoice("图鉴",showCodex);

        const label=s.realm===4?"★ 渡劫飞升 ★":"★ 突破 · "+REALM_INFO[s.realm+1]+"期 ★";

      }

      const bp=getMeditateBonus();if(bp>0)gain=Math.floor(gain*(1+bp/100));

    function generateRandomTasks(){
      s.randomTasksRefreshCount=(s.randomTasksRefreshCount||0)+1;
      const pool=RANDOM_ACTIVITIES[s.realm]||[];
      const prevIds=(s.randomTasks||[]).map(t=>t.id);
      const available=pool.filter(t=>!prevIds.includes(t.id));
      const usePool=available.length>=3?available:pool;
      const count=1+Math.floor(Math.random()*3);
      const shuffled=[...usePool].sort(()=>Math.random()-0.5);
      s.randomTasks=shuffled.slice(0,count).map(t=>({...t,bonus:1.3+Math.random()*0.2}));
      if(s.randomTasksRefreshCount%3===0){
        const limited=LIMITED_ACTIVITIES[s.realm]||[];
        if(limited.length>0){
          const act=limited[Math.floor(Math.random()*limited.length)];
          s.randomTasks.push({...act,bonus:1.6,limited:true});
        }
      }
      s.randomTasksRealm=s.realm;
      s.randomTasksRefreshYear=getNominalYear()+RANDOM_REFRESH[s.realm];
    }
    function refreshRandomTasks(){
      const now=getNominalYear();
      if(s.randomTasksRealm===s.realm&&now<s.randomTasksRefreshYear&&s.randomTasks.length>0)return;
      generateRandomTasks();
    }
    function trainingMenu(){
      choicesEl.innerHTML="";refreshRandomTasks();

    function distributeYears(total,count){
      const years=new Array(count).fill(Math.floor(total/count));
      let rem=total-years.reduce((a,b)=>a+b,0);let i=0;
      while(rem>0){if(i%2===0)years[Math.floor(i/2)]++;else years[count-1-Math.floor(i/2)]++;rem--;i++;}
      return years;
    }
    function pickEvent(events){
      const total=events.reduce((a,b)=>a+b.p,0);let roll=Math.random()*total;
      for(const e of events){roll-=e.p;if(roll<0)return e;}return events[0];
    }
    function applyEventEffects(ev,summary,bonus){
      bonus=bonus||1;
      if(ev.cult){const v=ev.cult>0?Math.floor(ev.cult*0.7*bonus):ev.cult;s.cultivation+=v;summary.cult+=v;if(s.cultivation<0)s.cultivation=0;}
      if(ev.spirit){const v=ev.spirit>0?Math.floor(ev.spirit*bonus):ev.spirit;s.spirit+=v;summary.spirit+=v;if(s.spirit<0)s.spirit=0;}
      if(ev.hp){s.hp+=ev.hp;summary.hp+=ev.hp;}
      if(ev.comp){s.comprehension+=ev.comp;summary.comp+=ev.comp;}
      if(ev.maxHp){s.maxHp+=ev.maxHp;}
      if(ev.lifespan){s.lifespan+=ev.lifespan;summary.lifespan=(summary.lifespan||0)+ev.lifespan;}
      if(ev.item){addItemToInventory(ev.item);summary.items.push(ev.item);}
      if(ev.skill){const id=ev.skill[Math.floor(Math.random()*ev.skill.length)];if(!s.learnedSkills.includes(id)){learnSkill(id,true);summary.skills.push(id);}}
    }
    function addItemToInventory(id){
      const item=ITEMS[id];const slot=s.inventory.find(x=>x.id===id);
      if(slot){slot.count++;}else{s.inventory.push({id,count:1});}
    }
    function tryDropItem(pool,summary){
      if(!pool||pool.length===0)return null;
      const id=pool[Math.floor(Math.random()*pool.length)];
      addItemToInventory(id);summary.items.push(id);return id;
    }

    /* 掉落装备（用于道具秘境） */
    function dropEquip(realm, rarities, summary, legendary){
      let pool=getEquipPool(realm, rarities);
      if(pool.length===0)pool=getEquipPool(realm);
      if(pool.length===0)return null;
      const id=pool[Math.floor(Math.random()*pool.length)];
      addItemToInventory(id);
      if(summary)summary.items.push(id);
      return id;
    }

    function getStrongEnemyRealm(){return Math.min(s.realm+1,4);}
    function findEscapeItem(enemyRealm){
      const escapes=["dun_di_fu","tu_dun_fu","suo_di_fu","shun_yi_fu","da_nuo_yi_fu"];
      for(const id of escapes){
        const item=ITEMS[id];
        if(item&&item.escapeRealm>=enemyRealm){
          const slot=s.inventory.find(x=>x.id===id&&x.count>0);
          if(slot)return id;
        }
      }
      return null;
    }
    async function triggerStrongEnemy(){
      const enemyRealm=getStrongEnemyRealm();
      print("");await typePrint("忽然，一位修为深不可测的蒙面强者出现在你面前！",18);
      await sleep(400);await typePrint("他冷冷看了你一眼，你只觉浑身僵硬，动弹不得。",18);
      await sleep(400);
      const escapeId=findEscapeItem(enemyRealm);
      if(escapeId){
        const slot=s.inventory.find(x=>x.id===escapeId);slot.count--;
        if(slot.count<=0){const i=s.inventory.indexOf(slot);s.inventory.splice(i,1);}
        await typePrint("你捏碎一张【"+ITEMS[escapeId].name+"】，瞬间传送千里，逃过一劫。",18);
        await sleep(400);updateStats();return;
      }
      s.hp=0;
      await typePrint("对方一掌拍来，你躲闪不及，被当场击杀！",18);
      await sleep(400);updateStats();
    }
    function showHpPauseMenu(resolve){
      choicesEl.innerHTML="";
      addChoice("打开储物袋",()=>{showInventory(()=>showHpPauseMenu(resolve));});
      addChoice("继续历练",()=>{choicesEl.innerHTML="";resolve(true);});
      addChoice("中止历练",()=>{choicesEl.innerHTML="";trainingAborted=true;resolve(false);});
    }
    function checkHpPause(){
      return new Promise(resolve=>{
        if(s.hp/s.maxHp<0.3&&s.hp>0){showHpPauseMenu(resolve);}
        else{resolve(true);}
      });
    }

    async function startTraining(activity,isRandom){
      if(trainingInProgress)return;
      trainingInProgress=true;trainingAborted=false;choicesEl.innerHTML="";
      currentScene="training";
      const totalYears=activity.years;
      const bonus=isRandom?(activity.bonus||1.3):1;
      const dropBonus=isRandom?0.15:0;
      spendLife(totalYears);
      print("");
      const title=activity.limited?("☆ "+activity.name):(isRandom?("★ "+activity.name):activity.name);
      await typePrint("你开始【"+title+"】，此行约 "+totalYears+" 年……",18);
      await sleep(500);print("");
      const summary={cult:0,spirit:0,hp:0,comp:0,lifespan:0,items:[],skills:[],events:0,wins:0};

      if(activity.tournament){
        for(let round=0;round<activity.tournament.length;round++){
          const t=activity.tournament[round];
          await typePrint(t.text,18);await sleep(400);
          const npc=getNPC(t.opponent);if(!npc)continue;
          const log=doCombat(npc);await typePrint(log,18);await sleep(400);
          if(s.hp<=0){await typePrint("你倒下了……",18);trainingInProgress=false;checkEnd();return;}
          if(s.hp/s.maxHp<0.3){const cont=await checkHpPause();if(!cont||trainingAborted)break;}
          summary.wins++;
          const winReward=[30,60,100,200][summary.wins-1]||200;
          const winSpirit=[20,40,70,150][summary.wins-1]||150;
          s.cultivation+=Math.floor(winReward*0.7);s.spirit+=winSpirit;
          summary.cult+=Math.floor(winReward*0.7);summary.spirit+=winSpirit;
          if(summary.wins>=2){s.comprehension+=1;summary.comp=(summary.comp||0)+1;}
        }
        if(trainingAborted){trainingAborted=false;print("");await typePrint("你中止了历练，返回。",18);print("");trainingInProgress=false;returnToTraining();return;}
        if(summary.wins===activity.tournament.length){
          const champItem=dropEquip(s.realm,["稀有","传说"],summary);
          await typePrint("★★★ 你夺得了冠军！ ★★★",18);await sleep(400);
          if(champItem){await typePrint("冠军奖励：【"+ITEMS[champItem].name+"】",18);await sleep(300);}
        }
        if(isRandom){s.randomTasks=s.randomTasks.filter(t=>t.id!==activity.id);if(s.randomTasks.length===0)generateRandomTasks();}
        trainingInProgress=false;
        await showTrainingSummary(summary,totalYears,activity,isRandom);return;
      }

      const eventCount=Math.min(totalYears,Math.max(2,Math.round(totalYears/2.5)));
      const yearDist=distributeYears(totalYears,eventCount);
      let cumYear=0;
      for(let i=0;i<eventCount;i++){
        if(trainingAborted)break;
        const evYears=yearDist[i];const startYear=cumYear+1;const endYear=cumYear+evYears;cumYear=endYear;
        let yearLabel;
        if(evYears===1)yearLabel="第 "+startYear+" 年";
        else if(i===0)yearLabel="前 "+evYears+" 年";
        else if(i===eventCount-1)yearLabel="最后 "+evYears+" 年";
        else yearLabel="第 "+startYear+" 到 "+endYear+" 年";
        if(Math.random()<0.025){
          await triggerStrongEnemy();
          if(checkEnd()){trainingInProgress=false;return;}
          const cont1=await checkHpPause();if(!cont1||trainingAborted)break;continue;
        }
        const ev=pickEvent(activity.events);summary.events++;
        await typePrint(yearLabel+"，"+ev.text,18);await sleep(350);
        applyEventEffects(ev,summary,bonus);updateStats();
        if(checkEnd()){trainingInProgress=false;return;}
        if(ev.combat){
          const npc=getNPC(ev.combat);
          if(npc){
            const log=doCombat(npc);await typePrint(log,18);await sleep(350);
            if(Math.random()<0.40+dropBonus+getDropBonus()/100){
              const dropId=tryDropItem(npc.drops.length>0?npc.drops:TRAINING_DROPS[s.realm],summary);
              if(dropId){await typePrint("你在战斗中摸尸，获得【"+ITEMS[dropId].name+"】。",18);await sleep(300);}
            }
          }
          if(ev.reward){
            if(ev.reward.spirit){const v=Math.floor(ev.reward.spirit*bonus);s.spirit+=v;summary.spirit+=v;}
            if(ev.reward.cult){const v=Math.floor(ev.reward.cult*bonus);s.cultivation+=v;summary.cult+=v;}
          }
          updateStats();if(checkEnd()){trainingInProgress=false;return;}
        }else{
          let dropRate=0;let pool=TRAINING_DROPS[s.realm];
          if(ev.cat==="gain")dropRate=0.15+dropBonus;
          else if(ev.cat==="special")dropRate=0.30+dropBonus;
          else if(ev.cat==="danger"){dropRate=0.35+dropBonus;pool=TRAINING_RARE_DROPS[s.realm];}
          dropRate+=getDropBonus()/100;
          if(dropRate>0&&Math.random()<dropRate){
            const dropId=tryDropItem(pool,summary);
            if(dropId){await typePrint("你在途中获得【"+ITEMS[dropId].name+"】。",18);await sleep(300);updateStats();}
          }
        }
        if(ev.buySkill){
          if(s.spirit>=10){
            s.spirit-=10;
            const pool=["changchungong","dayanjue","guixishu","nalingjue"];
            const id=pool[Math.floor(Math.random()*pool.length)];
            if(!s.learnedSkills.includes(id)){
              learnSkill(id,true);summary.skills.push(id);
              await typePrint("你买下玉简，研读后学会【"+ITEMS[id].name+"】。",18);
            }else{await typePrint("你买下的玉简中功法，你已学过。",18);}
          }else{await typePrint("你摸了摸空空的储物袋，只好作罢。",18);}
          await sleep(350);
        }
        if(checkEnd()){trainingInProgress=false;return;}
        const cont=await checkHpPause();if(!cont||trainingAborted)break;
      }
      if(trainingAborted){
        trainingAborted=false;print("");await typePrint("你中止了历练，返回。",18);print("");
        trainingInProgress=false;returnToTraining();return;
      }
      if(isRandom){s.randomTasks=s.randomTasks.filter(t=>t.id!==activity.id);if(s.randomTasks.length===0)generateRandomTasks();}
      trainingInProgress=false;
      await showTrainingSummary(summary,totalYears,activity,isRandom);
    }
    function returnToTraining(){
      s.turn++;const hpDelta=getHpPerTurn();if(hpDelta!==0){s.hp+=hpDelta;}
      updateStats();if(checkEnd())return;trainingMenu();
    }
    async function showTrainingSummary(summary,totalYears,activity,isRandom){
      print("");
      const title=isRandom?(activity.limited?("☆ "+activity.name):("★ "+activity.name)):activity.name;
      await typePrint(totalYears+" 年【"+title+"】结束。",18);await sleep(400);
      await typePrint("你共经历 "+(summary.events||summary.wins)+" 件事：",18);await sleep(400);
      const lines=[];
      if(summary.cult>0)lines.push("- 修为 +"+summary.cult);else if(summary.cult<0)lines.push("- 修为 "+summary.cult);
      if(summary.spirit!==0)lines.push("- 灵石 "+(summary.spirit>0?"+":"")+summary.spirit);
      if(summary.comp>0)lines.push("- 悟性 +"+summary.comp);
      if(summary.hp!==0)lines.push("- 气血 "+(summary.hp>0?"+":"")+summary.hp);
      if(summary.lifespan)lines.push("- 寿元 "+summary.lifespan);
      summary.items.forEach(id=>lines.push("- 获得【"+ITEMS[id].name+"】"));
      summary.skills.forEach(id=>lines.push("- 学会【"+ITEMS[id].name+"】"));
      for(const line of lines){await typePrint(line,18);await sleep(280);}
      print("");await sleep(400);returnToTraining();
    }

    function doCombat(npc){
      const playerAtk=getPlayerAttack();
      const def=getDefReduction();
      let log="";
      let instantKill=false;
      if(s.equipment.special==="tianguizhu"&&Math.random()<0.20&&npc.hp<playerAtk*2)instantKill=true;
      if(playerAtk>=npc.hp||instantKill){
        const atkName=s.equipment.attack?"【"+ITEMS[s.equipment.attack].name+"】":"赤手空拳";
        if(instantKill)log="你祭出【天鬼珠】，"+npc.name+"魂魄被摄，当场毙命。";
        else log="你祭出"+atkName+"，"+npc.name+"还未近身，便已倒地气绝。";
      }else{
        const rounds=Math.ceil(npc.hp/playerAtk);
        const perHit=Math.max(0,npc.atk-def);
        let dmgTaken=perHit*(rounds-1);
        if(s.equipment.defense==="yinyi"&&Math.random()<0.15){dmgTaken=Math.floor(dmgTaken/2);log="【银翼】展开，你闪避了部分攻击。";}
        if(s.equipment.defense==="tianjisan"&&Math.random()<0.10){dmgTaken=Math.floor(dmgTaken/2);log="【天机伞】转动，你避开了致命一击。";}
        s.hp-=dmgTaken;
        if(dmgTaken===0){
          log="你与"+npc.name+"缠斗 "+rounds+" 合，将其斩杀。";
          if(def>0)log+="护甲将对方攻势尽数挡下，你毫发无伤。";
          else log+="你毫发无伤。";
        }else{
          log="你与"+npc.name+"缠斗 "+rounds+" 合，将其斩杀，气血 -"+dmgTaken+"。";
        }
      }
      const rewards=[];
      if(npc.type!=="同门"){
        const sp=5+s.realm*5;
        const cu=8+s.realm*8;
        s.spirit+=sp;s.cultivation+=cu;
        rewards.push("灵石 +"+sp,"修为 +"+cu);
      }
      if(rewards.length>0)log+=" "+rewards.join("，")+"。";
      return log;
    }

    function realmDiffClass(recRealm){const diff=s.realm-recRealm;if(diff>=1)return "realm-easy";if(diff===0)return "realm-normal";if(diff===-1)return "realm-hard";return "realm-danger";}
    function realmDiffText(recRealm){const diff=s.realm-recRealm;if(diff>=2)return "（你已远超，收益减少）";if(diff===1)return "（你境界略高，收益略减）";if(diff===0)return "（势均力敌）";if(diff===-1)return "（你境界不足，危险）";return "（你境界远低，极危险）";}

    function enterRealm(realm,isToken){

    function exploreLayer(realm,layerIdx,isToken){
      if(layerIdx>=realm.layers.length){finishRealm(realm,isToken);return;}
      const layer=realm.layers[layerIdx];
      print("");print("【第 "+(layerIdx+1)+" 层 · "+layer.name+"】");print(layer.risk);print("");

    function showLayerChoices(realm,layerIdx,layer,isToken){
      choicesEl.innerHTML="";
      const layerCost=LIFE_COST[s.realm][2];
      addChoice("继续探索（-"+layerCost+" 年）",()=>{spendLife(layerCost);resolveLayerEvent(realm,layerIdx,layer,isToken);});
      addChoice("打开储物袋",()=>{showInventory(()=>showLayerChoices(realm,layerIdx,layer,isToken));});
      addChoice("退出秘境",()=>{print("你决定退出秘境。");print("");currentScene="main";turnEnd();});
    }
    function resolveLayerEvent(realm,layerIdx,layer,isToken){
      const events=layer.events;
      let roll=Math.random()*100;
      let picked=events[0],acc=0;
      for(const e of events){acc+=e.p;if(roll<acc){picked=e;break;}}
      print(picked.text);print("");
      const prog=s.realmProgress[realm.id]||{};

      if(picked.npc){
        const npc=getNPC(picked.npc,layerIdx);
        if(npc){print(doCombat(npc));print("");}
        updateStats();if(checkEnd())return;
        exploreLayer(realm,layerIdx+1,isToken);return;
      }
      /* 永久增益事件：检查是否已生效过 */
      if(picked.permanent&&picked.key){
        if(s.obtainedBuffs[picked.key]){
          print("此地机缘已被你取走，你只找到一些灵石。");
          s.spirit+=50;print("");
          updateStats();if(checkEnd())return;
          exploreLayer(realm,layerIdx+1,isToken);return;
        }
        s.obtainedBuffs[picked.key]=true;
      }
      if(picked.cult)s.cultivation+=picked.cult;
      if(picked.spirit)s.spirit+=picked.spirit;
      if(picked.hp)s.hp+=picked.hp;
      if(picked.comp)s.comprehension+=picked.comp;
      if(picked.maxHp)s.maxHp+=picked.maxHp;
      if(picked.atkPerm)s.permAtkBonus+=picked.atkPerm;
      if(picked.allBonus)s.allBonus+=picked.allBonus;
      if(picked.skill){
        const id=picked.skill[Math.floor(Math.random()*picked.skill.length)];
        if(!s.learnedSkills.includes(id))learnSkill(id);
      }
      if(picked.item){
        acquireItem(picked.item,()=>{updateStats();if(checkEnd())return;exploreLayer(realm,layerIdx+1,isToken);});return;
      }
      if(picked.rareLoot){
        if(!prog.rareLooted){
          const item=randomItemByRarity(["稀有"]);
          if(item){
            print("你获得稀有宝物【"+ITEMS[item].name+"】！");
            s.realmProgress[realm.id]={...prog,rareLooted:true};
            acquireItem(item,()=>{updateStats();if(checkEnd())return;exploreLayer(realm,layerIdx+1,isToken);});return;
          }
        }else{
          print("此地宝物已被取走，你只找到一些灵石。");
          s.spirit+=30;
        }
      }
      /* 装备掉落 */
      if(picked.equipDrop){
        const item=dropEquip(s.realm,["普通","稀有"],null);
        if(item){
          print("你获得【"+ITEMS[item].name+"】！");
          addItemToInventory(item);updateStats();
        }
      }
      /* 宝箱 */
      if(picked.chest){
        const rarities=picked.legendary?["稀有","传说"]:["稀有"];
        const item=dropEquip(s.realm,rarities,null);
        if(item){
          print("你打开宝箱，获得【"+ITEMS[item].name+"】！");
          addItemToInventory(item);updateStats();
        }else{
          print("宝箱中空空如也。");
        }
      }
      /* 寻宝罗盘 */
      if(!isToken&&layerIdx===realm.layers.length-1&&!s.uniqueObtained["xunbaoluopan"]&&!s.uniqueLost["xunbaoluopan"]&&Math.random()<0.05){
        s.uniqueObtained["xunbaoluopan"]=true;
        print("");print("★★★ 你意外发现了一件稀世宝物：【寻宝罗盘】！ ★★★");
        acquireItem("xunbaoluopan",()=>{updateStats();if(checkEnd())return;exploreLayer(realm,layerIdx+1,isToken);});return;
      }
      /* 洞天古迹唯一宝物 */
      if(!isToken&&layerIdx===realm.layers.length-1&&!prog.uniqueLooted&&realm.uniqueReward){
        const uid=realm.uniqueReward;
        if(!s.uniqueObtained[uid]&&!s.uniqueLost[uid]){
          print("");print("★★★ 你发现了此秘境的镇秘之宝：【"+ITEMS[uid].name+"】！ ★★★");
          s.uniqueObtained[uid]=true;
          s.realmProgress[realm.id]={...prog,uniqueLooted:true};
          acquireItem(uid,()=>{updateStats();if(checkEnd())return;exploreLayer(realm,layerIdx+1,isToken);});return;
        }
      }
      updateStats();if(checkEnd())return;
      exploreLayer(realm,layerIdx+1,isToken);
    }

    function extractNPCs(realm){
      const npcs=[];const seen={};
      realm.layers.forEach(layer=>{
        layer.events.forEach(ev=>{
          if(!ev.npc)return;
          let id,name,hp,atk;
          if(typeof ev.npc==="string"){
            id=ev.npc;const base=NPC_DATA[id];if(!base)return;
            name=base.name;hp=base.base.hp;atk=base.base.atk;
          }else{
            name=ev.npc.name;id=name;hp=ev.npc.hp;atk=ev.npc.atk;
          }
          if(seen[id])return;seen[id]=true;
          npcs.push({name,hp,atk});
        });
      });
      return npcs;
    }

    /* ============ 物品操作 ============ */
    function showItemActions(itemId,idx,onDone){
      const it=ITEMS[itemId];
      const overlay=document.createElement("div");overlay.className="overlay";
      const rc=it.rarity==="唯一"?"唯一":it.rarity;
      const canUse=(it.type==="丹药"||it.consumable)&&it.type!=="入场道具";
      function refresh(){
        const slot=s.inventory.find(x=>x.id===itemId);
        const countEl=overlay.querySelector("#itemCount");
        if(countEl)countEl.textContent=slot?slot.count:0;
        overlay.querySelectorAll(".use-btn").forEach(btn=>{btn.disabled=!slot||slot.count<=0;});
        const ls=overlay.querySelector("#liveStats");
        if(ls){
          const hpPct=s.hp/s.maxHp;
          const hpColor=hpPct<0.3?"#e86a6a":(hpPct<0.5?"#e8d86a":"#6ad86a");
          ls.innerHTML=`<span>❤ 气血 <b style="color:${hpColor}">${s.hp}/${s.maxHp}</b></span>
    <span>⏳ 寿元 <b style="color:#e8c86a">${Math.floor(s.lifespan)}</b></span>
    <span>修为 <b style="color:#6ad86a">${Math.floor(s.cultivation)}</b></span>
    <span>悟性 <b style="color:#6a9ad8">${s.comprehension}</b></span>`;
        }
      }
      overlay.innerHTML=`<div class="panel" style="max-width:420px;">
    <h2 class="${it.unique?'name unique':''}">${it.name}</h2>
    <div class="item-detail">
    <div class="meta">${it.type} · ${rc}</div>
    <div>效果：${it.effect}</div>
    <div class="desc">${it.desc}</div>
    ${it.unique?'<div class="unique-tag">此物独一无二。</div>':''}
    ${canUse?'<div class="price-line">当前数量：<span id="itemCount">1</span></div>':''}
    </div>
    ${canUse?'<div class="live-stats" id="liveStats"></div>':''}
    ${canUse?`<div class="panel-actions three">
    <button class="use-btn" data-n="1">使用 ×1</button>
    <button class="use-btn" data-n="5">使用 ×5</button>
    <button class="use-btn" data-n="10">使用 ×10</button>
    </div>`:''}
    <div class="panel-actions" id="itemActions"></div>
    </div>`;
      document.body.appendChild(overlay);
      const actions=overlay.querySelector("#itemActions");
      function close(){document.body.removeChild(overlay);}
      if(it.slot){
        const btn=document.createElement("button");
        btn.textContent="装备";
        btn.onclick=()=>{
          const old=s.equipment[it.slot];
          s.equipment[it.slot]=itemId;
          const slot=s.inventory.find(x=>x.id===itemId);
          slot.count--;
          if(slot.count<=0){const i=s.inventory.indexOf(slot);s.inventory.splice(i,1);}
          if(old){addItemToInventory(old);}
          print("你装备了【"+it.name+"】。");
          close();if(onDone)onDone();
        };
        actions.appendChild(btn);
      }
      const discardBtn=document.createElement("button");
      discardBtn.className="danger";
      discardBtn.textContent="丢弃";
      discardBtn.onclick=()=>{
        if(it.unique&&!confirm("【"+it.name+"】是唯一宝物，确定丢弃？"))return;
        if(it.rarity==="传说"&&!confirm("【"+it.name+"】稀有，确定丢弃？"))return;
        const slot=s.inventory.find(x=>x.id===itemId);
        slot.count--;
        if(slot.count<=0){const i=s.inventory.indexOf(slot);s.inventory.splice(i,1);}
        if(it.unique)s.uniqueLost[itemId]=true;
        print("你丢弃了【"+it.name+"】。");
        close();if(onDone)onDone();
      };
      actions.appendChild(discardBtn);
      const cancelBtn=document.createElement("button");
      cancelBtn.textContent="关闭";
      cancelBtn.onclick=close;
      actions.appendChild(cancelBtn);
      if(canUse){
        overlay.querySelectorAll(".use-btn").forEach(btn=>{
          btn.onclick=()=>{
            const n=parseInt(btn.dataset.n);let used=0;
            for(let i=0;i<n;i++){
              const slot=s.inventory.find(x=>x.id===itemId);
              if(!slot||slot.count<=0)break;
              const success=useItemById(itemId);
              if(success)used++;else break;
            }
            if(used>0){
              updateStats();
              if(onDone)onDone();
              const stillHas=s.inventory.find(x=>x.id===itemId);
              if(!stillHas){close();}else{refresh();}
            }
          };
        });

    function useItemById(itemId){
      const it=ITEMS[itemId];
      const slot=s.inventory.find(x=>x.id===itemId);
      if(!slot||slot.count<=0)return false;
      if(it.lifespanGain){
        const used=s.lifespanUsed[itemId]||0;
        if(used>=it.maxUses){print("【"+it.name+"】药力已尽。");print("");return false;}
        s.lifespanUsed[itemId]=used+1;
        s.lifespan+=it.lifespanGain;
        print("你服下【"+it.name+"】，寿元 +"+it.lifespanGain+"。");
        print("（已服 "+(used+1)+"/"+it.maxUses+"）");
        slot.count--;
        if(slot.count<=0){const i=s.inventory.indexOf(slot);s.inventory.splice(i,1);}
        print("");return true;
      }
      if(it.hpGain){
        const used=s.lifespanUsed[itemId]||0;
        if(used>=it.maxUses){print("【"+it.name+"】药力已尽。");print("");return false;}
        s.lifespanUsed[itemId]=used+1;
        s.maxHp+=it.hpGain;
        print("你服下【"+it.name+"】，气血上限 +"+it.hpGain+"。");
        print("（已服 "+(used+1)+"/"+it.maxUses+"）");
        slot.count--;
        if(slot.count<=0){const i=s.inventory.indexOf(slot);s.inventory.splice(i,1);}
        print("");return true;
      }
      if(itemId==="mijingcantu"){
        slot.count--;
        if(slot.count<=0){const i=s.inventory.indexOf(slot);s.inventory.splice(i,1);}
        const closed=SECRET_REALMS.find(r=>{const p=s.realmProgress[r.id]||{};return p.permanentClosed;});
        if(closed){
          s.realmProgress[closed.id]={...(s.realmProgress[closed.id]||{}),permanentClosed:false};
          print("【"+closed.name+"】已重新开启。");
        }else print("没有可重新开启的秘境。");
        print("");return true;
      }
      if(itemId==="yinlufu"){
        slot.count--;
        if(slot.count<=0){const i=s.inventory.indexOf(slot);s.inventory.splice(i,1);}
        SECRET_REALMS.forEach(r=>{if(s.realmProgress[r.id])s.realmProgress[r.id].rareLooted=false;});
        print("所有秘境的稀有掉落记录已重置。");print("");
        return true;
      }
      if(itemId==="jiuriYinji"){
        slot.count--;
        if(slot.count<=0){const i=s.inventory.indexOf(slot);s.inventory.splice(i,1);}
        const missed=SECRET_REALMS.find(r=>{const p=s.realmProgress[r.id]||{};return p.permanentClosed&&!p.cleared&&s.realm>=r.recRealm;});
        if(missed){
          s.realmProgress[missed.id]={...(s.realmProgress[missed.id]||{}),permanentClosed:false,visitOnce:true};
          print("【"+missed.name+"】已可用旧日印记进入一次。");
        }else print("没有可进入的已关闭秘境。");
        print("");return true;
      }
      if(it.type==="入场道具"){print("【"+it.name+"】需在探索秘境时使用。");print("");return false;}
      slot.count--;
      if(slot.count<=0){const i=s.inventory.indexOf(slot);s.inventory.splice(i,1);}
      print("你使用了【"+it.name+"】。");
      if(itemId==="huichundan"){s.hp=Math.min(s.maxHp,s.hp+30);print("气血 +30。");}
      if(itemId==="xiaohuandan"){s.hp=Math.min(s.maxHp,s.hp+80);print("气血 +80。");}
      if(itemId==="dahuandan"){s.hp=Math.min(s.maxHp,s.hp+200);print("气血 +200。");}
      if(itemId==="jiuzhuandan"){s.hp=s.maxHp;print("气血全满。");}
      if(itemId==="juqidan"){s.cultivation+=60;print("修为 +60。");}
      if(itemId==="wudaodan"){s.comprehension+=1;print("悟性 +1。");}
      if(itemId==="pozhangdan"){s.bonusBreakthrough+=15;print("下次突破 +15%。");}
      if(itemId==="qingxindan"){s.failCount=Math.max(0,s.failCount-1);print("失败计数 -1。");}
      if(itemId==="ningyuandan"){s.bonusBreakthrough+=10;print("本次突破 +10%。");}
      if(itemId==="jingxinliantai"){s.failCount=Math.max(0,s.failCount-1);print("失败计数 -1。");}
      if(itemId==="tianjipan")print("天机盘指针狂转。");
      if(itemId==="chuansongfu")print("传送符已备。");
      print("");return true;
    }

    /* ============ 装备合成 ============ */
    function showSynthPanel(onClose){
      choicesEl.innerHTML="";
      const overlay=document.createElement("div");overlay.className="overlay";
      // 扫描储物袋，找出可合成的组合（同境界、同品级、数量≥3）
      const combos={};
      s.inventory.forEach(sl=>{
        const it=ITEMS[sl.id];
        if(it.type!=="攻击法器"&&it.type!=="防御法器")return;
        if(it.unique)return;
        if(it.rarity==="传说")return;
        if(it.realm===undefined)return;
        if(it.realm!==s.realm)return; // 只合成当前境界的装备
        const key=it.rarity;
        if(!combos[key])combos[key]=[];
        combos[key].push(sl);
      });
      const available=[];
      Object.keys(combos).forEach(rarity=>{
        const total=combos[rarity].reduce((a,sl)=>a+sl.count,0);
        if(total>=3&&RARITY_CHAIN[rarity]){
          available.push({rarity,count:total,nextRarity:RARITY_CHAIN[rarity]});
        }
      });
      let html='<div class="panel"><h2>装备合成</h2>';
      html+='<div style="color:#8a7a5c;font-size:13px;text-align:center;">3 件同境界同品级装备 + 灵石 → 1 件高一阶装备</div>';
      html+=`<div style="color:#8ac86a;font-size:13px;text-align:center;">当前境界：${REALM_INFO[s.realm]}期 · 合成消耗：${SYNTH_COST[s.realm]} 灵石</div>`;
      html+='<div style="color:#8a7a5c;font-size:12px;text-align:center;margin-top:4px;">（仅可合成当前境界装备，传说装备不可再合）</div>';
      if(available.length===0){
        html+='<div style="color:#8a7a5c;text-align:center;padding:30px;">暂无可合成的装备组合。<br>需要 3 件同境界、同品级的装备。</div>';
      }else{
        html+='<div class="synth-pool" style="margin-top:10px;">';
        available.forEach(a=>{
          const canAfford=s.spirit>=SYNTH_COST[s.realm];
          html+=`<div class="synth-slot${canAfford?'':' disabled'}" data-rarity="${a.rarity}">
    <div style="color:#e8c86a;font-size:14px;font-weight:bold;">${a.rarity} → ${a.nextRarity}</div>
    <div style="color:#8a7a5c;font-size:12px;">可用：${a.count} 件</div>
    <div style="color:${canAfford?'#8ac86a':'#e86a6a'};font-size:12px;">消耗：${SYNTH_COST[s.realm]} 灵石</div>
    <div style="color:#a89878;font-size:12px;">${canAfford?'点击选择目标装备':'灵石不足'}</div>
    </div>`;
        });
        html+='</div>';
      }
      html+='<div class="panel-actions" style="margin-top:10px;"><button class="wide" id="synthClose">返回</button></div></div>';
      overlay.innerHTML=html;
      document.body.appendChild(overlay);

      overlay.querySelectorAll(".synth-slot:not(.disabled)").forEach(slot=>{
        slot.onclick=()=>{
          const rarity=slot.dataset.rarity;
          document.body.removeChild(overlay);
          showSynthTarget(rarity,onClose);
        };
      });
      overlay.querySelector("#synthClose").onclick=()=>{
        document.body.removeChild(overlay);
        showInventory(onClose);
      };
    }
    function showSynthTarget(sourceRarity,onClose){
      const nextRarity=RARITY_CHAIN[sourceRarity];
      if(!nextRarity){print("该品级无法继续合成。");print("");showInventory(onClose);return;}
      const pool=getEquipPool(s.realm,[nextRarity]);
      if(pool.length===0){print("没有可合成的目标装备。");print("");showInventory(onClose);return;}
      const overlay=document.createElement("div");overlay.className="overlay";
      let html=`<div class="panel"><h2>选择目标装备</h2>`;
      html+=`<div style="color:#8a7a5c;font-size:13px;text-align:center;">消耗 3 件【${sourceRarity}】装备 + ${SYNTH_COST[s.realm]} 灵石</div>`;
      html+='<div class="synth-pool" style="margin-top:10px;">';
      pool.forEach(id=>{
        const it=ITEMS[id];
        const bonus=getEquipBonus(it)+(it.slot==="defense"?" 减免":" 伤害");
        html+=`<div class="synth-slot" data-id="${id}">
    <div style="color:#e8c86a;font-size:14px;font-weight:bold;">${it.name}</div>
    <div style="color:#8a7a5c;font-size:12px;">${it.type} · ${it.rarity}</div>
    <div style="color:#a8d888;font-size:12px;">${it.effect}</div>
    <div style="color:#a89878;font-size:11px;">当前实际加成：+${bonus}</div>
    </div>`;
      });
      html+='</div>';
      html+='<div class="panel-actions" style="margin-top:10px;"><button class="wide" id="synthCancel">返回</button></div></div>';
      overlay.innerHTML=html;
      document.body.appendChild(overlay);
      overlay.querySelectorAll(".synth-slot").forEach(slot=>{
        slot.onclick=()=>{
          const targetId=slot.dataset.id;
          document.body.removeChild(overlay);
          doSynth(sourceRarity,targetId,onClose);
        };
      });
      overlay.querySelector("#synthCancel").onclick=()=>{
        document.body.removeChild(overlay);
        showSynthPanel(onClose);
      };
    }
    function doSynth(sourceRarity,targetId,onClose){
      const cost=SYNTH_COST[s.realm];
      if(s.spirit<cost){print("灵石不足。");print("");showInventory(onClose);return;}
      // 收集 3 件装备
      const picked=[];
      for(let i=0;i<s.inventory.length&&picked.length<3;i++){
        const slot=s.inventory[i];
        const it=ITEMS[slot.id];
        if(it.type!=="攻击法器"&&it.type!=="防御法器")continue;
        if(it.unique)continue;
        if(it.realm!==s.realm)continue;
        if(it.rarity!==sourceRarity)continue;
        picked.push({idx:i,slot});
      }
      if(picked.length<3){print("装备数量不足。");print("");showInventory(onClose);return;}
      // 扣灵石
      s.spirit-=cost;
      // 移除 3 件（从后往前删，避免索引错乱）
      const idxs=picked.map(p=>p.idx).sort((a,b)=>b-a);
      idxs.forEach(i=>{
        const slot=s.inventory[i];
        slot.count--;
        if(slot.count<=0)s.inventory.splice(i,1);
      });
      // 加目标装备
      addItemToInventory(targetId);
      print("");
      print("⚒ 合成成功！");
      print("消耗 3 件【"+sourceRarity+"】装备 + "+cost+" 灵石。");
      print("获得【"+ITEMS[targetId].name+"】！");
      print("");
      updateStats();
      showInventory(onClose);
    }

    /* ============ 突破 ============ */
    function breakthrough(){
      currentScene="breakthrough";
      const isFinal=s.realm===4;
      print("");
      if(isFinal){print("【渡劫】");print("天穹乌云翻涌，雷光如龙。");}
      else{print("【突破】");print("你运转功法，冲击 "+REALM_INFO[s.realm+1]+"期 瓶颈。");}
      print("");
      choicesEl.innerHTML="";
      const hasPozhang=s.inventory.find(sl=>sl.id==="pozhangdan");
      const hasNingyuan=s.inventory.find(sl=>sl.id==="ningyuandan");
      const hasJingxin=s.inventory.find(sl=>sl.id==="jingxinliantai");
      if(hasPozhang)addChoice("用破障丹（+15%）",()=>{removeItem("pozhangdan");s.bonusBreakthrough+=15;print("你服下破障丹。");doBreakthrough(isFinal);});
      if(hasNingyuan)addChoice("用凝元丹（+10%）",()=>{removeItem("ningyuandan");s.bonusBreakthrough+=10;print("你服下凝元丹。");doBreakthrough(isFinal);});
      if(hasJingxin)addChoice("用静心莲台",()=>{removeItem("jingxinliantai");s.failCount=Math.max(0,s.failCount-1);print("你坐上莲台。");doBreakthrough(isFinal);});
      addChoice("直接突破",()=>doBreakthrough(isFinal));
      addChoice("返回",()=>{print("你暂且压下突破的冲动。");print("");currentScene="main";showActions();});
    }
    function doBreakthrough(isFinal){
      let chance=Math.min(0.95,0.45+s.comprehension*0.04);
      chance+=(s.bonusBreakthrough+getBreakthroughBonus())/100;
      chance=Math.max(0.05,Math.min(0.95,chance));
      s.bonusBreakthrough=0;
      print("");
      if(Math.random()<chance){
        if(isFinal){ascendToImmortal();return;}
        const overflow=Math.max(0,s.cultivation-REQ[s.realm]);
        s.cultivation=Math.floor(overflow*0.5);
        s.realm++;
        s.failCount=0;
        const bonus=LIFEBONUS[s.realm];
        const hpBonus=HPBONUS[s.realm];
        s.lifespan+=bonus;
        s.maxHp+=hpBonus;
        s.hp=s.maxHp;
        print("轰——");
        print("瓶颈破碎，你成功踏入 "+REALM_INFO[s.realm]+"期！");
        print("寿元 +"+bonus+"，气血上限 +"+hpBonus+"，气血全满。");
        if(s.cultivation>0)print("溢出修为保留 "+s.cultivation+" 点。");
      }else{
        s.failCount++;
        const dmg=20+s.realm*15;
        s.hp-=dmg;
        s.cultivation=Math.floor(s.cultivation*0.7);
        print("气息一乱，真气反噬！");
        print("突破失败，气血 -"+dmg+"，修为倒退。");
        print("（失败次数："+s.failCount+" / 3）");
      }
      print("");
      turnEnd();
    }
    function removeItem(itemId){
      const idx=s.inventory.findIndex(sl=>sl.id===itemId);
      if(idx>=0){s.inventory[idx].count--;if(s.inventory[idx].count<=0)s.inventory.splice(idx,1);}
    }
    function randomItemByRarity(rarities){
      const pool=Object.keys(ITEMS).filter(id=>{
        const it=ITEMS[id];
        return rarities.includes(it.rarity)&&it.type!=="功法"&&it.type!=="入场道具"&&!it.unique&&!it.lifespanGain&&it.type!=="逃脱道具";
      });
      if(pool.length===0)return null;
      return pool[Math.floor(Math.random()*pool.length)];
    }

        {text:"· 习得功法 "+skillCount+" 门",cls:""},{text:"",cls:""},
        {text:"━━━━━━━━━━━━━━",cls:"ascend-divider"},{text:"",cls:""},
        {text:"凡尘已远，仙路漫漫。",cls:""},
        {text:"此去，再无归期。",cls:""},{text:"",cls:""},
        {text:"—— 飞 升 成 仙 ——",cls:"ascend-final"}
      ];
      let idx=0;
      function nextLine(){
        if(idx>=lines.length){
          const btn=document.createElement("button");
          btn.textContent="重 新 开 始";
          btn.onclick=()=>{document.body.removeChild(overlay);init();};
          contentEl.appendChild(btn);
          return;
        }
        const item=lines[idx];
        const p=document.createElement("p");
        p.textContent=item.text;
        if(item.cls)p.className=item.cls;
        if(item.text==="")p.innerHTML="&nbsp;";
        contentEl.appendChild(p);
        contentEl.scrollTop=contentEl.scrollHeight;
        idx++;
        const delay=item.text===""?150:500;
        setTimeout(nextLine,delay);
      }
      setTimeout(nextLine,300);
    }

    init();
    </script>
    </body>
    </html>
